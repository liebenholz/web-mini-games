name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wmg
          POSTGRES_DB: wmg_test
          # 테스트 동안만 뜨는 일회용 DB라 비밀번호 없이 연다 (비밀값을 만들지도, 커밋하지도 않는다)
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wmg -d wmg_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wmg@localhost:5432/wmg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    # 러너 이미지에 들어 있는 Google Chrome을 쓴다 (playwright.config.ts의 PW_CHANNEL).
    # playwright install --with-deps는 브라우저 다운로드는 몇 초인데 apt로 시스템 라이브러리를 까는 데 6~12분이 걸렸다
    env:
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - run: pnpm --filter client e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/client/playwright-report
          retention-days: 7
