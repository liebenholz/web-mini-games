name: deploy-client

# main 머지 시 운영 배포, PR마다 미리보기 배포 (Cloudflare Pages)
# 필요한 값 (🙋 사람이 등록):
#   secrets.CLOUDFLARE_API_TOKEN, secrets.CLOUDFLARE_ACCOUNT_ID
#   vars.CF_PAGES_PROJECT   (Pages 프로젝트 이름)
#   vars.VITE_SERVER_URL    (예: wss://api.<도메인>)

on:
  push:
    branches: [main]
    paths:
      ['packages/client/**', 'packages/rules/**', 'pnpm-lock.yaml', '.github/workflows/deploy-client.yml']
  pull_request:
    paths: ['packages/client/**', 'packages/rules/**']

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # 포크 PR에는 비밀값이 없으므로 건너뛴다
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter client... build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy packages/client/dist
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=${{ github.event_name == 'push' && 'main' || github.head_ref }}
