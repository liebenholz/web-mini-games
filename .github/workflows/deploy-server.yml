name: deploy-server

# v* 태그를 올리면 arm64 이미지를 빌드해 GHCR에 올리고, 운영 VM에서 compose로 교체한다.
# VM의 SSH(22)는 인터넷에 열지 않는다. 러너가 Tailscale(tag:ci)로 tailnet에 잠시 들어와 VM(tag:server)에 접속한다.
# 필요한 값 (🙋 사람이 등록, 절차는 docs/ops/deploy-oracle.md):
#   secrets.TS_OAUTH_CLIENT_ID, secrets.TS_OAUTH_SECRET   (Tailscale OAuth 클라이언트, auth_keys 범위, tag:ci)
#   secrets.DEPLOY_SSH_HOST   (VM의 tailnet 이름, 예: wmg-server)
#   secrets.DEPLOY_SSH_USER, secrets.DEPLOY_SSH_KEY, secrets.DEPLOY_SSH_KNOWN_HOSTS
#   VM의 ~/wmg/infra/.env (POSTGRES_*, API_DOMAIN, CORS_ORIGINS) — 저장소에는 넣지 않는다

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/server:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-24.04
    needs: image
    environment: production
    steps:
      - uses: actions/checkout@v4
      # 일회용 노드로 tailnet에 들어온다. 작업이 끝나면 액션이 로그아웃하고 노드가 사라진다
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_SSH_HOST }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload compose files
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'mkdir -p ~/wmg/infra/caddy'
          scp -i ~/.ssh/deploy_key infra/docker-compose.yml "$USER@$HOST:~/wmg/infra/docker-compose.yml"
          scp -i ~/.ssh/deploy_key infra/caddy/Caddyfile "$USER@$HOST:~/wmg/infra/caddy/Caddyfile"
      - name: Pull and restart
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # 서버는 SIGTERM을 받으면 새 방을 막고 진행 중인 판이 끝날 때까지 기다린 뒤 종료한다 (stop_grace_period 16m)
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "cd ~/wmg/infra && SERVER_IMAGE='$IMAGE' docker compose pull server && SERVER_IMAGE='$IMAGE' docker compose up -d --remove-orphans"
